
name: Build RQ Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip -q RQ-General-Services-CrossPlatform-Source.zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: RQ-CrossPlatform
        run: npm install

      - name: Create Android project
        working-directory: RQ-CrossPlatform
        run: npx cap add android

      - name: Sync application
        working-directory: RQ-CrossPlatform
        run: npx cap sync android

      - name: Build APK
        working-directory: RQ-CrossPlatform/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RQ-Android-APK
          path: RQ-CrossPlatform/android/app/build/outputs/apk/debug/app-debug.apk
